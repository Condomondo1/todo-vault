# Jira field mapping.
#
# Copy this to <vault>/jira-map.yaml and fill it in for YOUR instance, or let
# the desktop app's Settings → Jira write it for you: the app starts from this
# very text and edits values in place, so these comments survive. Almost every
# value below differs between Jira sites, which is why this is config and not
# code.
#
# To fill in the custom field ids, let the CLI read them off your instance:
#
#   JIRA_EMAIL=you@company.com JIRA_TOKEN=... \
#     vault jira discover --url https://yoursite.atlassian.net --project ENG
#
# It prints a fragment to paste in here, annotated with the name each id had on
# your site. It reads only the project you name, and writes nothing:
#
#   GET /rest/api/3/project/ENG
#   GET /rest/api/3/issue/createmeta/ENG/issuetypes
#   GET /rest/api/3/issue/createmeta/ENG/issuetypes/{issueTypeId}   (one per type)
#
# Only fields on this project's create screens are considered, so a field that
# exists elsewhere on your site but not here is never proposed.
#
# This file is never sent anywhere. It is used only to build a payload you
# review before anything leaves the machine.

# Where these items land. This is the Jira project key, not your vault key.
jiraProjectKey: ENG

# Your Jira site. Links back to created issues are built from it, and a classic
# API token is sent here.
baseUrl: https://yourcompany.atlassian.net

# "site" for a classic API token, sent to baseUrl. "scoped" for a scoped token,
# which Atlassian only accepts through its API gateway; the gateway needs the
# site's cloud id, which Settings → Jira looks up for you.
auth: site
# cloudId: 11111111-2222-3333-4444-555555555555

# The credential itself is never in this file. The desktop app keeps it in your
# OS credential store; the CLI reads JIRA_EMAIL and JIRA_TOKEN from the
# environment. This file is committed with the vault, so a token here would be
# in its git history for good.

# Local item type -> Jira issue type NAME as it appears on the create screen.
# Team-managed and company-managed projects often differ here, and some sites
# have renamed "Story" to something bespoke.
issueTypes:
  epic: Epic
  story: Story
  task: Task
  bug: Bug
  subtask: Subtask

# Local priority -> Jira priority name.
priorities:
  highest: Highest
  high: High
  medium: Medium
  low: Low
  lowest: Lowest

fields:
  # Start date is a custom field on essentially every instance, and the id is
  # different on each one. customfield_10015 is a common default on Jira Cloud
  # but do not trust it — look it up. Leave this out and the push will warn you
  # rather than silently dropping your start dates. Commented out here so a
  # guessed id is never used by accident.
  # startDate: customfield_10015

  # Story points, or whatever you decided `estimate` means. Also commented out
  # until looked up: team-managed and company-managed projects use different
  # fields for it.
  # estimate: customfield_10016

  # Only needed on older company-managed projects that still use the Epic Link
  # field instead of the modern `parent` field.
  # epicLink: customfield_10014

  # Where the local `category` field goes. Either the literal string "labels"
  # to fold it into labels (spaces become hyphens), or a customfield id.
  category: labels

# People, as the vault spells them, to Jira accounts. Jira Cloud identifies a
# person by account id, never by name, so an assignee with no entry here is
# pushed unassigned (and the push says so). Settings → Jira fills this in by
# searching the people who can be assigned in the project. Names are matched
# case-insensitively.
people: {}
#  dan okafor: { accountId: "5b10ac8d82e05b22cc7d4ef5", displayName: "Dan Okafor" }

# Jira fields the vault has no equivalent for, and what to send in them. Values
# are written already in the shape Jira's create API takes, by id where Jira
# offers one. "always" sends the value on every issue; "ask" offers it, prefilled,
# in the push pane, where it can be changed for that one push. issueTypes limits
# a field to the issue types whose create screen has it.
extraFields: {}
#  customfield_10001:
#    name: Team
#    mode: always
#    value: "36885b3c-1bf0-4f85-a357-c5b858c31de4"
#  fixVersions:
#    name: Fix versions
#    mode: ask
#    value: [{ id: "10021" }]
#    issueTypes: [Story, Bug]

# The older form of extraFields: sent on every issue, no names, no asking.
# Still read; Settings → Jira offers to move these into extraFields.
defaults: {}

# Local status -> Jira transition name. Issues are created in the project's
# default status, so anything not starting in "To Do" needs a transition applied
# after creation.
statusTransitions:
  in_progress: Start work
  in_review: Ready for review
  blocked: Block
  done: Done
  # Closed locally, but not because the work happened. Most Jira workflows call
  # this "Won't Do"; check yours, because the transition name has to match.
  disregard: Won't Do
